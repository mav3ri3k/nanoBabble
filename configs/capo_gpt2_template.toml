data_source = "synth"
train_data_path = "train.parquet"
data_column = "token_id"

seed = 42
batch_size = 2
ctx_len = 1024
learning_rate = 0.0003

vocab_size = 50257
dim = 512
num_heads = 8
num_layers = 6
ffn_dim = 1024

attn = "mha"
attn_local = "swa"
attn_global_every = 1
swa_window = 128
mla_latent_dim = 128

[ignore]
checkpoint_dir = "checkpoints"
train_steps = 2
checkpoint_every_steps = 20
save_checkpoint = true
resume = false
test = true
enable_metrics = true
metrics_db_path = "experiments.db"
metrics_flush_every = 100
experiment_name = "capo_gpt2_template"
run_description = "Template config for Capo + GPT-2 tokenization in nanoBabble."

[synth]
dataset = "capo"
brevo_N = 90
brevo_multi = false
depo_N = 100
depo_K = 16
depo_M = 10
depo_qa = false
depo_qa_mode = "appendix"
depo_separator = false
depo_mini_vocab = 3
depo_min_tlen = 5
depo_max_tlen = 7
depo_emit_token_type = false
mano_L = 10
mano_ttype = "asm"
mano_value_mod = 23
mano_knowledge_augment = true
lano_config = "data-synthetic-pretrain/Lano-cfg/configs/cfg3f.json"
lano_bos_token = 9999
lano_eos_token = 9998
capo_capo_file = "data-synthetic-pretrain/Capo-bioS-bioR/Capo-bioS-bioR.py"
capo_fields_dir = "data-synthetic-pretrain/Capo-bioS-bioR/fields"
capo_order = "random"
capo_N = 50000
capo_exposures_per_person = 100
